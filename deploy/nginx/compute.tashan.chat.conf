server {
    listen 80;
    listen [::]:80;
    server_name compute.tashan.chat *.workspaces.compute.tashan.chat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compute.tashan.chat *.workspaces.compute.tashan.chat;

    ssl_certificate /etc/letsencrypt/live/compute.tashan.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compute.tashan.chat/privkey.pem;

    client_max_body_size 10g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:13980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
}
