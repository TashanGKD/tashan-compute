services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tcompute_test
      POSTGRES_USER: tcompute_test
      POSTGRES_PASSWORD: tcompute_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcompute_test -d tcompute_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
