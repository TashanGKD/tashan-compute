name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Start test PostgreSQL
        run: docker compose -f compose.test.yml up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f compose.test.yml exec -T postgres pg_isready -U tcompute_test -d tcompute_test; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f compose.test.yml logs postgres
          exit 1
      - name: Verify foundation
        run: bash scripts/verify-foundation.sh
      - name: Race detector
        run: go test -race ./internal/...
      - name: Stop test services
        if: always()
        run: docker compose -f compose.test.yml down --volumes
